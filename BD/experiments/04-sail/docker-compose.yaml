services:
  sail-server:
    build:
      context: . # use docker compose up -d --build for continuous building
      dockerfile: Dockerfile
    image: sail-local:latest
    container_name: sail-server
    command:
      - spark
      - server
      - --ip
      - 0.0.0.0
      - --port
      - "50051"
    ports:
      - "6066:50051"
    volumes:
      - ./data-server:/opt/sail/data
    networks:
      - sail-cluster
    restart: unless-stopped

